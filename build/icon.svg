<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a140d"/>
      <stop offset="100%" stop-color="#0b0906"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0b93e"/>
      <stop offset="100%" stop-color="#c98a1c"/>
    </linearGradient>
  </defs>

  <!-- app-icon squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- projector stand -->
  <rect x="472" y="676" width="80" height="70" rx="10" fill="#3a2c14"/>
  <rect x="392" y="738" width="240" height="34" rx="17" fill="#3a2c14"/>

  <!-- screen frame -->
  <rect x="182" y="256" width="660" height="430" rx="36" fill="none" stroke="url(#amber)" stroke-width="34"/>

  <!-- play triangle -->
  <path d="M 452 388 L 452 554 L 596 471 Z" fill="url(#amber)"/>

  <!-- live / broadcast dot -->
  <circle cx="789" cy="303" r="30" fill="#f0b93e"/>
  <circle cx="789" cy="303" r="30" fill="none" stroke="#f0b93e" stroke-width="14" opacity="0.35">
    <animate attributeName="r" values="30;58;30" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0;0.35" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
